version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: postgis_lab
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodatabase}
      POSTGRES_USER: ${POSTGRES_USER:-geouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopass}
      # Configuración para permitir conexiones
      POSTGRES_HOST_AUTH_METHOD: md5  # Usa md5 para autenticación segura
    ports:
      - "55432:5432"  # Exponer para conexión externa (QGIS local)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgis/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      bash -c "echo \"listen_addresses='*'\" >> /var/lib/postgresql/data/postgresql.conf &&
               echo \"host all all 0.0.0.0/0 md5\" >> /var/lib/postgresql/data/pg_hba.conf &&
               docker-entrypoint.sh postgres"

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter_lab
    env_file:
      - .env
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    depends_on:
      - postgis

  webapp:
    image: python:3.11
    container_name: web_app
    working_dir: /app
    command: bash -c "pip install streamlit geopandas psycopg2-binary sqlalchemy && streamlit run main.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - ./app:/app
    ports:
      - "5000:8501"
    depends_on:
      - postgis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgis

volumes:
  postgres_data:
  pgadmin_data:
